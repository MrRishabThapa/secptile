# Echo cancellation for Secptile, run as its own process by
# secptile-echo-cancel.service. It adds a mic source without restarting
# PipeWire or changing your default devices. Stop the service to remove it.
#
# monitor.mode listens to whatever your default output is playing, so this
# works on both speakers and headphones without rerouting any audio.
# https://docs.pipewire.org/page_module_echo_cancel.html
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}

context.modules = [
    { name = libpipewire-module-rt
      args = { }
      flags = [ ifexists nofail ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
      args = {
          library.name = aec/libspa-aec-webrtc
          monitor.mode = true
          source.props = {
              node.name = "secptile_echo_cancel"
              node.description = "Secptile Mic (echo cancelled)"
              priority.session = 1
          }
      }
    }
]
